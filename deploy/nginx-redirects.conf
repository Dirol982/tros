# 301-редиректы со старых адресов tros-kpp.by на новую структуру.
# Подключить внутри server { ... } для www.tros-kpp.by.

location = /neispravnosti-trosov { return 301 https://www.tros-kpp.by/remont-trosov.html; }
location = /neispravnosti-kulis  { return 301 https://www.tros-kpp.by/remont-kulis.html; }
location = /diagnostics          { return 301 https://www.tros-kpp.by/diagnostika.html; }
location = /contacts             { return 301 https://www.tros-kpp.by/kontakty.html; }
location ^~ /component/          { return 301 https://www.tros-kpp.by/; }
if ($arg_format ~* "^feed$")     { return 301 https://www.tros-kpp.by/; }

